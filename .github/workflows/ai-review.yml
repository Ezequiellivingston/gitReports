- name: Comment PR
  uses: actions/github-script@v7
  env:
    RESPONSE: ${{ env.RESPONSE }}
  with:
    script: |
      let body = "⚠️ No hubo respuesta válida";

      try {
        const outer = JSON.parse(process.env.RESPONSE);

        if (outer.data) {
          // extraer JSON interno (lo que devuelve Gemini)
          const match = outer.data.match(/\{[\s\S]*\}/);

          if (match) {
            const inner = JSON.parse(match[0]);

            body = `
🧠 AI Review Score: ${inner.score}

${inner.summary}

Issues:
${inner.issues.length === 0 
  ? "✅ Sin problemas detectados" 
  : inner.issues.map(i => `- [${i.severity}] ${i.message}`).join("\n")}
`;
          } else {
            body = "❌ No se pudo extraer JSON interno:\n\n" + outer.data;
          }
        } else {
          body = JSON.stringify(outer, null, 2);
        }

      } catch (e) {
        body = "❌ Error parseando:\n\n" + process.env.RESPONSE;
      }

      await github.rest.issues.createComment({
        issue_number: context.issue.number,
        owner: context.repo.owner,
        repo: context.repo.repo,
        body
      });