- name: Comment PR
  uses: actions/github-script@v7
  env:
    RESPONSE: ${{ env.RESPONSE }}
  with:
    script: |
      let body = "⚠️ No hubo respuesta válida";

      try {
        const outer = JSON.parse(process.env.RESPONSE);

        if (outer.data) {
          body = "📦 Respuesta de la IA:\n\n" + outer.data;
        } else {
          body = JSON.stringify(outer, null, 2);
        }

      } catch (e) {
        body = "❌ Error parseando:\n\n" + process.env.RESPONSE;
      }

      await github.rest.issues.createComment({
        issue_number: context.issue.number,
        owner: context.repo.owner,
        repo: context.repo.repo,
        body
      });